name: ci
on: [push, pull_request]
jobs:
  kernel-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest pyyaml jsonschema openapi-spec-validator pglast
      - run: make contract
      - run: make test
      - run: make diff

  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: graft
          POSTGRES_PASSWORD: graft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U graft" --health-interval 2s
          --health-timeout 5s --health-retries 20
    env:
      GRAFT_TEST_DATABASE_URL: postgres://graft:graft@localhost:5432/postgres?sslmode=disable
      GRAFT_DOCKER: "1"   # runner, cancel and escape tests use real containers (GitHub runners have Docker)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26", cache-dependency-path: service/go.sum }
      - run: test -z "$(gofmt -l service kernel)" || (gofmt -l service kernel; exit 1)
      - run: cd service && go vet ./... && go test -race -count=1 ./...

  sdk-drift:
    # Regenerate the SDK models from the contract; fail if they differ from what is committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv sdk/python/.venv && sdk/python/.venv/bin/pip install -e 'sdk/python[codegen]'
      - run: make drift-check

  sdk-typing:
    # mypy --strict and pyright strict on the library and tests, no Any in the public API,
    # and the built wheel type-checked from a clean venv, as a user would install it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e 'sdk/python[dev]'
      - run: cd sdk/python && mypy
      - run: cd sdk/python && pyright
      - run: python scripts/no_any.py
      - run: PYBIN=python ./scripts/check_wheel.sh

  sdk-unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]   # oldest supported and newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e 'sdk/python[dev]'
      - run: cd sdk/python && python -m pytest tests/unit -q

  e2e:
    runs-on: ubuntu-latest
    env:
      GRAFT_TOKEN: ci-only-token-not-a-secret
      GRAFT_URL: http://localhost:8080
      GRAFT_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: docker compose up --build --detach --wait
      - run: pip install -e 'sdk/python[dev]'
      - run: cd sdk/python && python -m pytest tests/e2e tests/chaos -v -s
      - if: failure()
        run: docker compose logs graftd
      - if: always()
        run: docker compose down
