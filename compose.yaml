# Local stack: `docker compose up --wait`, then run the SDK's e2e tests against it.
services:
  graftd:
    build:
      context: .
      dockerfile: service/Dockerfile
    environment:
      # Local default only. Never use this value anywhere reachable.
      GRAFT_TOKEN: ${GRAFT_TOKEN:-local-dev-token-change-me}
      GRAFT_WORKERS: "2"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/graftd", "-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 15
