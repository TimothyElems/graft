[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graft-sdk"
version = "0.4.0.dev0"
description = "Typed Python client for the Graft API: sync and async, models generated from the contract."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Typing :: Typed"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21", "pyyaml>=6", "mypy==2.4.1", "pyright==1.1.414", "build==1.6.1"]
# Pinned exactly: the drift gate needs byte-identical output from the same contract.
codegen = ["datamodel-code-generator==0.92.0", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/graft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs a running graftd (set GRAFT_E2E=1)"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/graft", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema"]
ignore_missing_imports = true

[tool.pyright]
include = ["src/graft", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
