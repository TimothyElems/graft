[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graft-sdk"
version = "0.2.0.dev0"
description = "Typed Python client for the Graft API (early: v0.2)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27,<1"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Typing :: Typed"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21", "pyyaml>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/graft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: needs a running graftd (set GRAFT_E2E=1)"]
